name: Bug report
description: Report incorrect behavior in pysqlcage
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please do not include secrets, production data, or private credentials.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the input, expected result, actual result, and traceback if any.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A short Python snippet or CLI command.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python and pysqlcage versions
      placeholder: Python 3.12, pysqlcage 1.0.0
    validations:
      required: true
