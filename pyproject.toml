[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pysqlcage"
version = "1.0.0"
description = "Zero-dependency parameterized SQL builder, strict schema allowlists, LIKE and IN helpers, and a lexical SQL injection risk auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "draarivpatel-ui contributors" }]
keywords = [
    "cwe-89",
    "database",
    "mysql",
    "parameterized-queries",
    "postgres",
    "security",
    "sql-injection",
    "sqlite",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
pysqlcage = "pysqlcage.cli:main"

[project.urls]
Homepage = "https://github.com/draarivpatel-ui/pysqlcage"
Repository = "https://github.com/draarivpatel-ui/pysqlcage"
Issues = "https://github.com/draarivpatel-ui/pysqlcage/issues"
Documentation = "https://github.com/draarivpatel-ui/pysqlcage#readme"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pysqlcage*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pysqlcage = ["py.typed"]
